name: Quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.15'
          python-version: '3.12'
      - run: uv sync --frozen --group dev
      - run: uv run ruff check src tests scripts migrations
      - run: uv run ruff format --check src tests scripts migrations
      - run: uv run mypy src
      - run: uv run pytest -q
      - name: Check corpus inventory and evaluation dataset
        working-directory: .
        run: |
          uv run --project backend python backend/scripts/prepare_corpus.py --inventory-only
          uv run --project backend python -m evaluations.assemble_dataset
          git diff --exit-code -- knowledge_base/manifest.json evaluations/datasets/knowledge.jsonl
      - name: Evaluation unit tests
        working-directory: .
        run: uv run --project backend python -m pytest -q evaluations/tests
      - run: uv run smartdesk export-openapi
        env:
          SESSION_SECRET: ci-schema-generation-not-a-deployment-secret
      - run: git diff --exit-code -- ../contracts/openapi.json
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.15'
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --project backend --frozen --group dev
      - run: npm ci
        working-directory: frontend
      - run: npm run generate:api && git diff --exit-code -- src/api/generated.ts
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: frontend/test-results/
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t smartdesk-${{ matrix.component }}:${{ github.sha }} ./${{ matrix.component }}
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          exit-code: '1'
