[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smartdesk"
version = "0.1.0"
description = "Grounded IT and HR support with explicit ticket approval"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.7,<3",
  "email-validator>=2.2,<3", "sqlalchemy>=2.0,<3", "alembic>=1.14,<2",
  "psycopg[binary,pool]>=3.2,<4", "langgraph>=1,<2",
  "langgraph-checkpoint-postgres>=3,<4", "langgraph-checkpoint-sqlite>=3,<4",
  "openai>=2,<3", "langsmith>=0.4,<1", "httpx>=0.28,<1", "qdrant-client>=1.14,<2",
  "fastembed>=0.7,<1", "PyJWT[crypto]>=2.10,<3", "pyyaml>=6,<7",
  "structlog>=25,<26", "opentelemetry-instrumentation-fastapi>=0.50b0,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-PyYAML>=6", "respx>=0.22,<1"]

[project.scripts]
smartdesk = "smartdesk.cli:main"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
